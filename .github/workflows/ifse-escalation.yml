name: IFSE Automatic Escalation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ifse-automatic-escalation
  cancel-in-progress: false

jobs:
  escalate-due-sos:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected IFSE escalation engine
        env:
          IFSE_ESCALATION_URL: ${{ secrets.IFSE_ESCALATION_URL }}
          IFSE_ESCALATION_SECRET: ${{ secrets.IFSE_ESCALATION_SECRET }}
        run: |
          set -euo pipefail
          test -n "$IFSE_ESCALATION_URL"
          test -n "$IFSE_ESCALATION_SECRET"
          case "$IFSE_ESCALATION_URL" in
            https://*/api/ifse-dispatch/escalate-due) ;;
            *)
              echo "IFSE_ESCALATION_URL must be the HTTPS FastAPI escalation endpoint."
              exit 1
              ;;
          esac
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-IFSE-Escalation-Secret: $IFSE_ESCALATION_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$IFSE_ESCALATION_URL"
