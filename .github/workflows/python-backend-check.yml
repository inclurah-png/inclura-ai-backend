name: Python backend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check SOS backend JavaScript syntax
        run: |
          node --check server.js
          node --check firebaseAuth.middleware.js
          node --check ifseDispatch.routes.js
          node --check responderResponse.routes.js
          node --check agencyDispatch.service.js
          node --check sosNotifications.routes.js
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile app.py ifse_runtime.py
      - name: Verify FastAPI routes
        run: |
          python - <<'PY'
          from app import app
          paths = {route.path for route in app.routes}
          assert "/api/ifse-dispatch/{emergency_id}/dispatch" in paths
          assert "/api/responder-response/{emergency_id}/accept" in paths
          assert "/api/responder-response/{emergency_id}/arrived" in paths
          assert "/api/ifse-dispatch/escalate-due" in paths
          assert "/api/creator-score/award" in paths
          assert "/api/posts/{post_id}/react" in paths
          assert "/api/sos-notifications/{emergency_id}/send" in paths
          print("Backend routes loaded successfully.")
          PY
