name: Python backend validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m py_compile app.py
      - name: Verify FastAPI routes
        run: |
          python - <<'PY'
          from app import app
          paths = {route.path for route in app.routes}
          assert "/api/ifse-dispatch/{emergency_id}/dispatch" in paths
          assert "/api/creator-score/award" in paths
          assert "/api/posts/{post_id}/react" in paths
          print("Backend routes loaded successfully.")
          PY
